name: build-nwa
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi python3
          mkdir -p $HOME/nwtools
          cd $HOME/nwtools && npm init -y > /dev/null && npm install nwlink@0.0.16
          echo 'Object.defineProperty(globalThis,"navigator",{value:{userAgent:"node"},writable:true,configurable:true});' > $HOME/nwpre.js
      - name: Compiler
        run: |
          python3 tools/build_kb.py kb/qa.txt
          make
      - uses: actions/upload-artifact@v4
        with:
          name: Genumi
          path: output/Genumi.nwa
