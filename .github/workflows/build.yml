name: build-nwa
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Outils ARM
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libnewlib-dev python3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache nwlink
        id: nwcache
        uses: actions/cache@v4
        with:
          path: ~/nwtools
          key: nwlink-0.0.16

      - name: Installer nwlink
        if: steps.nwcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/nwtools
          cd $HOME/nwtools && npm init -y > /dev/null && npm install nwlink@0.0.16

      - name: Préparer nwpre
        run: |
          echo 'Object.defineProperty(globalThis,"navigator",{value:{userAgent:"node"},writable:true,configurable:true});' > $HOME/nwpre.js

      - name: Base et compilation
        run: |
          python3 tools/build_kb.py kb/qa.txt
          make

      - uses: actions/upload-artifact@v4
        with:
          name: Genumi
          path: output/Genumi.nwa
